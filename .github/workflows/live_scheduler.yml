name: Live Scheduler

on:
  schedule:
    # Offset from :00/:30 deliberately -- GitHub's own scheduled-workflow docs warn
    # that `schedule` runs are delayed most at exactly the popular top-of-hour/
    # half-hour marks every default-configured cron job across GitHub converges on.
    # This project's own execution_metadata history confirmed the effect directly:
    # runs anchored at :00/:30 were landing 15-105+ minutes late, most days missing
    # the "24h"/"1week" candle_boundary_due window entirely (see
    # nero_core/execution/candle_schedule.py's BUG FOUND note). Still every 30
    # minutes, just off the busiest queueing slot. Steady-state coverage for every
    # gate that isn't one of the fragile single/multi-shot ones below.
    - cron: "3,33 * * * *"

    # REDUNDANT TRIGGER SAFETY NET (2026-07-29 infrastructure-resilience task):
    # widening candle_boundary_due/daily_time_due's own tolerance (see
    # candle_schedule.py) assumes SOME run lands inside the window -- but querying
    # this project's own execution_metadata directly showed GitHub Actions actually
    # DROPS most scheduled ticks outright under load, not just delays them: only
    # 11-18 of the nominal 48 daily "3,33 * * * *" runs actually fired across 11
    # observed days (23-37%), confirmed by counting real run timestamps against the
    # nominal schedule. A wide tolerance window is not the same as a reliable chance
    # to use it if most ticks in that window never fire at all.
    #
    # This project is a public repo, so GitHub Actions minutes are unlimited/free
    # (confirmed via the repo's own visibility) -- there is no cost reason not to
    # densify coverage specifically where it matters. These 3 extra entries add
    # ticks every ~10 minutes, but ONLY during the exact UTC windows the fragile
    # single-shot ("24h"/"1week", daily_time_due) and multi-shot ("12h") gates can
    # actually fire in (see candle_schedule.py's SINGLE_SHOT_TOLERANCE_MINUTES=240 /
    # MULTI_SHOT_TOLERANCE_MINUTES=150) -- every run outside its own gate's window
    # still costs nothing beyond the free runner minute itself, since
    # candle_boundary_due/daily_time_due correctly report NOT_DUE and no third-party
    # fetch ever happens (see run_once's own per-config gate checks) -- so this adds
    # real redundancy exactly where cron congestion has already been observed to
    # cause total misses, without multiplying pressure on any rate-limited data
    # source (Twelve Data, yfinance) outside those windows.
    #
    #   00:00-03:59 UTC: covers "24h"/"1week"'s single-shot window (240min) AND
    #     "12h"'s AM window (150min, fully contained within the wider one).
    - cron: "5,15,25,35,45,55 0-3 * * *"
    #   12:00-14:29 UTC: covers "12h"'s PM window (150min).
    - cron: "5,15,25,35,45,55 12-14 * * *"
    #   19:00-22:59 UTC: covers NEWS_SENTIMENT's daily_time_due window
    #     (hour_utc=19, 240min single-shot tolerance -- see candle_schedule.py).
    - cron: "5,15,25,35,45,55 19-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-scheduler
  cancel-in-progress: false

jobs:
  live-scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run live scheduler
        run: python -m nero_core.execution.live_scheduler
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true
      - name: Send ntfy notification
        run: python -m nero_core.execution.notify_ntfy
        continue-on-error: true
      - name: Export site data
        run: python -m nero_core.execution.export_site_data
        continue-on-error: true
      - name: Export candle data
        run: python -m nero_core.execution.export_candle_data
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        continue-on-error: true
      - name: Export quant metrics
        run: python -m nero_core.execution.export_quant_metrics
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        continue-on-error: true
      - name: Export quant cross-asset
        run: python -m nero_core.execution.export_quant_cross_asset
        continue-on-error: true
      - name: Save Truth Ledger
        run: |
          git config user.name "nero-live-scheduler"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main || git rebase --abort || true
          if [ -f data/truth_ledger.db ]; then
            git add -f data/truth_ledger.db
          fi
          if [ -d docs/site_data ]; then
            git add -f docs/site_data/
          fi
          if git diff --cached --quiet; then
            echo "no live scheduler changes"
            exit 0
          fi
          git commit -m "Update live scheduler execution log"
          git pull --rebase origin main || git rebase --abort || true
          git push || echo "live scheduler push skipped; next run will retry"
