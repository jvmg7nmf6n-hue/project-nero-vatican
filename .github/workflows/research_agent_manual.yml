name: Research Agent (manual run)

# workflow_dispatch ONLY -- no `schedule:` block. This is the agent's first
# real run and every run after it must be a deliberate, watched click from
# the Actions tab, not an automation. RESEARCH_AGENT_ENABLED is set inline in
# this one job's one step below, not as a repo secret/variable and not as a
# change to any other workflow's env -- the kill switch default (false)
# everywhere else is untouched.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Research Agent pipeline
        run: python -m nero_core.research_agent.pipeline
        env:
          RESEARCH_AGENT_ENABLED: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: false

      - name: Print readable run summary
        # Also writes docs/site_data/agent_run_summaries.json (append-only)
        # -- see research_agent_run_summary.py's own module docstring
        # (CC-1 review item 2): this run's aggregate calibration numbers
        # (claimed vs measured trades/year, TOO_SLOW rejections) must never
        # again exist only in this job's own log/artifact.
        run: python tools/research_agent_run_summary.py

      # STILL no commit/push for the three RAW files below on purpose: this
      # run's own hypothesis output must not become part of the record until
      # a human has inspected it (agent_hypotheses.json is append-only, so a
      # bad entry can't be cleanly removed later). Uploaded as a downloadable
      # artifact instead, unchanged from before.
      - name: Upload run output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-agent-run-${{ github.run_id }}
          path: |
            docs/site_data/agent_hypotheses.json
            docs/site_data/agent_test_results.json
            docs/site_data/agent_performance.json
          if-no-files-found: warn
          retention-days: 30

      # docs/site_data/agent_run_summaries.json IS committed automatically,
      # unlike the three files above -- it carries only AGGREGATE, DERIVED
      # statistics (counts, ratios, which hypothesis NAMES were TOO_SLOW),
      # never the raw hypothesis text/mechanism itself, so it does not carry
      # the same "un-reviewed bad proposal, can't be undone" risk the
      # no-commit rule above exists to guard against.
      - name: Commit run summary
        if: always()
        run: |
          git config user.name "nero-research-agent-summary"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main || git rebase --abort || true
          if [ -f docs/site_data/agent_run_summaries.json ]; then
            git add -f docs/site_data/agent_run_summaries.json
          fi
          if git diff --cached --quiet; then
            echo "no run summary changes"
            exit 0
          fi
          git commit -m "Record Research Agent run summary"
          git pull --rebase origin main || git rebase --abort || true
          git push || echo "run summary push skipped; next run will retry"
