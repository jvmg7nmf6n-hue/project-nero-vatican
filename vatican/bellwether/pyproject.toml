[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bellwether-engine"
version = "0.1.0"
description = "Multi-agent macro intelligence core for Gold (XAUUSD) and Bitcoin (BTCUSD)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
bellwether = "run:main"

[tool.setuptools]
packages = ["bellwether", "bellwether.agents", "bellwether.api",
            "bellwether.data", "bellwether.llm", "bellwether.store"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
